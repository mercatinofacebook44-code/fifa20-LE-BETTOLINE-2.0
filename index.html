function calc(cal){
  const map=new Map();
  const ensure=n=>{ if(!map.has(n)) map.set(n,{squadra:n,G:0,V:0,N:0,P:0,GF:0,GS:0,DR:0,Pt:0}) };
  DATA.squadre.forEach(ensure);
  cal.forEach(m=>{ ensure(m.casa); ensure(m.trasferta) });
  for(const m of cal){
    if(m.gc==='' || m.gt==='' || m.gc==null || m.gt==null) continue;
    let gc_eff, gt_eff;
    if(m.gc==='_'){ gc_eff=0; gt_eff=3 } else if(m.gt==='_'){ gc_eff=3; gt_eff=0 } else { gc_eff=Number(m.gc); gt_eff=Number(m.gt); if(isNaN(gc_eff)||isNaN(gt_eff)) continue }
    const casa=map.get(m.casa), trasf=map.get(m.trasferta);
    casa.G++; trasf.G++;
    casa.GF+=gc_eff; casa.GS+=gt_eff;
    trasf.GF+=gt_eff; trasf.GS+=gc_eff;
    if(gc_eff>gt_eff){ casa.V++; trasf.P++; casa.Pt+=3 }
    else if(gc_eff<gt_eff){ trasf.V++; casa.P++; trasf.Pt+=3 }
    else { casa.N++; trasf.N++; casa.Pt+=1; trasf.Pt+=1 }
  }
  const arr=Array.from(map.values()).map(t=>{ t.DR=t.GF-t.GS; return t });
  arr.sort((a,b)=> b.Pt-a.Pt || b.DR-a.DR || b.GF-a.GF || a.squadra.localeCompare(b.squadra));
  return arr;
}
